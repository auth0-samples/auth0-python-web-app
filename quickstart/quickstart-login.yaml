appType: "webapp"
technology: "python"
technologyLabel: "Python"
sdkVersion: &sdkVersion "1.x"
defaultAppOrigin:
  scheme: &appScheme "http"
  domain: &appDomain "localhost"
  port: &port 5000
outputFolderName: &outputFolderName "auth0-python-web-app"
callbackPath: "/callback"
logoutPath: "/"
defaultEnvFileName: &defaultEnvFileName ".env"

inputs:
  auth0Domain:
  auth0ClientId:
  auth0ClientSecret:
  sessionCookieSecret:
  port:
    default: *port
  appDomain:
    default: *appDomain
  appScheme:
    default: *appScheme

placeholders:
  "%GIT_REMOTE%":
    environmentKey: "gitRemote"
  "%GIT_BRANCH%":
    environmentKey: "gitBranch"
  "%DOWNLOAD_URL%":
    environmentKey: "downloadUrl"
  "%FOLDER_NAME%": *outputFolderName
  "%PORT%":
    inputKey: "port"
  "%AUTH0_DOMAIN%":
    inputKey: "auth0Domain"
  "%AUTH0_CLIENT_ID%":
    inputKey: "auth0ClientId"
  "%AUTH0_CLIENT_SECRET%":
    inputKey: "auth0ClientSecret"
  "%AUTH0_SECRET%":
    inputKey: "sessionCookieSecret"
  "%ENV_FILE_NAME%": *defaultEnvFileName
  "%SDK_VERSION%": *sdkVersion
  "%APP_DOMAIN%":
    inputKey: "appDomain"
  "%APP_SCHEME%":
    inputKey: "appScheme"

snippets:
  get-app: &getApp
    source: "quickstart/scripts/get-app.sh"
    language: "bash"
  configure: &configure
    source: "quickstart/scripts/configure.sh"
    language: "bash"
  start: &start
    source: "quickstart/scripts/start.sh"
    language: "bash"
  install-auth0: &installAuth0
    source: "quickstart/scripts/install-auth0.sh"
    language: "bash"
  env: &env
    fileName: *defaultEnvFileName
    content: |
      AUTH0_DOMAIN=%AUTH0_DOMAIN%
      AUTH0_CLIENT_ID=%AUTH0_CLIENT_ID%
      AUTH0_CLIENT_SECRET=%AUTH0_CLIENT_SECRET%

      # 64-character random string used to encrypt the session cookie
      # Generate with: openssl rand -hex 32
      AUTH0_SECRET=%AUTH0_SECRET%

      APP_BASE_URL=%APP_SCHEME%://%APP_DOMAIN%:%PORT%
      PORT=%PORT%
    language: "bash"
  server-py: &serverPy
    source: "server.py"
    language: "python"

tryOutStep: &tryOutStep
  - title: "Try it out"
    contentBlocks:
      - type: markdown
        content: |
          1. Open the sample application at [%APP_SCHEME%://%APP_DOMAIN%:%PORT%](%APP_SCHEME%://%APP_DOMAIN%:%PORT%).
          1. Click **Signup** to create a new user in your Auth0 tenant.
             This will redirect you to the Auth0 Universal Login page to complete the signup process.
          1. Once back in the app, view the details of the newly created user in the **User Profile** section.

download:
  - title: "Clone or download the sample app"
    contentBlocks:
      - type: markdown
        content: "Clone the sample application with the following command."
      - type: terminal
        <<: *getApp
      - type: markdown
        content: "Don't have `git` at hand? [Download as ZIP](%DOWNLOAD_URL%)"
  - title: "Configure the sample app"
    contentBlocks:
      - type: markdown
        content: "Install dependencies and create the environment file."
      - type: terminal
        <<: *configure
      - type: markdown
        content: "Copy the following environment variables into `%ENV_FILE_NAME%`:"
      - type: snippet
        <<: *env
  - title: "Start the app"
    contentBlocks:
      - type: markdown
        content: "The application runs on `%APP_BASE_URL%`"
      - type: terminal
        <<: *start
  - <<: *tryOutStep

steps:
  - title: "Configure environment variables"
    contentBlocks:
      - type: markdown
        content: "Add the following variables to your `.env` file in the project root."
      - type: snippet
        <<: *env
  - title: "Install the Auth0 Python SDK"
    contentBlocks:
      - type: markdown
        content: "Install the Auth0 Python SDK by running the following command in your project root."
      - type: terminal
        <<: *installAuth0
  - title: "Add login and logout"
    contentBlocks:
      - type: markdown
        content: "The following example shows how to display login and logout links based on the user's authentication state, and show the user's profile when authenticated."
      - type: snippet
        <<: *serverPy
  - <<: *tryOutStep

nextSteps:
  links:
    - label: "SDK Usage Examples"
      url: "https://github.com/auth0/auth0-server-python/tree/main/examples"
    - label: "Auth0 Python SDK"
      url: "https://github.com/auth0/auth0-server-python"

envSnippet: *env
